services:
  # ---------------------------------------------------------------------
  # MongoDB Database Server
  # ---------------------------------------------------------------------
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}
    volumes:
      - mongo_data:/data/db
      - ./seed/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  # ---------------------------------------------------------------------
  # Backend Microservices
  # ---------------------------------------------------------------------
  auth-service:
    build: ../sports-store-auth-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}@mongo:27017/auth_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  catalog-service:
    build: ../sports-store-catalog-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}@mongo:27017/catalog_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  cart-service:
    build: ../sports-store-cart-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}@mongo:27017/cart_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CATALOG_URL: http://catalog-service:8002
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8003/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  order-service:
    build: ../sports-store-order-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}@mongo:27017/order_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CART_URL: http://cart-service:8003
      CATALOG_URL: http://catalog-service:8002
      PAYMENT_URL: http://payment-service:8005
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8004/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  payment-service:
    build: ../sports-store-payment-service
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-dev-mongo-pw-change-me}@mongo:27017/payment_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PAYMENT_FAILURE_SUFFIX: ${PAYMENT_FAILURE_SUFFIX:-0000}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8005/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  # ---------------------------------------------------------------------
  # Frontend and NGINX gateway
  # ---------------------------------------------------------------------
  frontend:
    build: ../sports-store-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

  gateway:
    build: ../sports-store-gateway
    ports:
      - "8080:8080"
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sports-store-network

networks:
  sports-store-network:
    driver: bridge

volumes:
  mongo_data:
